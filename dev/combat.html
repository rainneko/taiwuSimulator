<html lang="zh">

    html, body { margin: 0; height: 100%; background: #1d1912; overflow: hidden; font: 13px/1.4 system-ui, sans-serif; }

    <div>A/D ±0.1 · Q/E ±0.5 · 空格 暂停</div>
