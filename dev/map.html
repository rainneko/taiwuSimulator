<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>World Map</title>
  <style>
    html, body { margin: 0; height: 100%; background: #cdbd9a; overflow: hidden; }
    #root { position: fixed; inset: 0; }
    #scene { display: block; width: 100%; height: 100%; }
    #labels, #hud { position: absolute; inset: 0; pointer-events: none; }
    #dev { position: fixed; bottom: 12px; right: 12px; font: 12px/1.4 system-ui, sans-serif; color: #3a2e22;
      background: rgba(251,247,238,.9); padding: 6px 10px; box-shadow: 2px 3px 0 rgba(60,40,20,.15); }
    #dev button { font: inherit; }
    #back { position: fixed; top: 12px; left: 12px; display: none; font: 14px "Songti SC", serif; background: #fbf7ee;
      border: 1px solid #a89574; padding: 4px 12px; cursor: pointer; box-shadow: 1px 2px 0 rgba(60,40,20,.15); }
  </style>
</head>
<body>
  <div id="root">
    <canvas id="scene"></canvas>
    <div id="labels"></div>
    <div id="hud"></div>
  </div>
  <button id="back"></button>
  <div id="dev">
    画质 <select id="q"><option value="high">high · PCSS</option><option value="medium">medium · PCF</option></select>
    <label><input id="pick" type="checkbox" /> pickOnly</label>
    <span id="stats"></span>
  </div>
  <script type="module" src="../src/dev/map-gallery.ts"></script>
</body>
</html>
