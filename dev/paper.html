<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paper Gallery</title>
  <style>
    html, body { margin: 0; height: 100%; background: #e9dfcb; overflow: hidden; font: 13px/1.4 system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #panel { position: fixed; top: 12px; left: 12px; background: rgba(251,247,238,.92); border: 1px solid #b9a888;
      padding: 10px 12px; border-radius: 4px; width: 230px; color: #3a2e22; box-shadow: 2px 3px 0 rgba(60,40,20,.15); }
    #panel h1 { font-size: 14px; margin: 0 0 6px; }
    #panel label { display: flex; justify-content: space-between; gap: 8px; margin: 4px 0; align-items: center; }
    #panel input[type=range] { width: 110px; }
    #panel button { margin: 2px 2px 2px 0; font: inherit; background: #fbf7ee; border: 1px solid #8c7a5c; border-radius: 3px; padding: 2px 8px; cursor: pointer; }
    #stats { margin-top: 6px; font-size: 11px; color: #6b5a44; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="panel">
    <h1>PaperMaterial 画廊</h1>
    <div>
      <button id="rise">起立</button><button id="fall">倒下</button><button id="half">半立</button><button id="nudge">点头</button>
    </div>
    <div><button id="ripple">合批波纹</button><button id="rippleFall">合批倒下</button></div>
    <label>画质 <select id="q"><option value="high">high · PCSS</option><option value="medium">medium · PCF</option><option value="low">low · blob</option></select></label>
    <label>光方位 <input id="az" type="range" min="0" max="360" value="300" /></label>
    <label>光高度 <input id="el" type="range" min="5" max="85" value="40" /></label>
    <label>纤维 <input id="fibre" type="range" min="0" max="0.6" step="0.01" value="0.22" /></label>
    <label>包裹 <input id="wrap" type="range" min="0" max="1" step="0.01" value="0.35" /></label>
    <label>透射 <input id="trans" type="range" min="0" max="1.5" step="0.01" value="0.55" /></label>
    <label>白闪 <input id="flash" type="range" min="0" max="1" step="0.01" value="0" /></label>
    <label>溶解 <input id="fade" type="range" min="0" max="1" step="0.01" value="0" /></label>
    <label>纹理随物体移动 <input id="slide" type="checkbox" /></label>
    <div id="stats"></div>
  </div>
  <script type="module" src="../src/dev/paper-gallery.ts"></script>
</body>
</html>
