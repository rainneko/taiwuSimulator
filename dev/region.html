<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Region Grid</title>
  <style>
    html, body { margin: 0; height: 100%; background: #e6dcc6; overflow: hidden; font: 13px/1.4 system-ui, sans-serif; }
    #scene { display: block; width: 100%; height: 100%; }
    #panel { position: fixed; top: 12px; left: 12px; background: rgba(251,247,238,.94); border: 1px solid #b9a888;
      padding: 10px 12px; border-radius: 4px; width: 240px; color: #3a2e22; box-shadow: 2px 3px 0 rgba(60,40,20,.15); }
    #panel h1 { font-size: 14px; margin: 0 0 6px; }
    #panel button { margin: 2px 2px 2px 0; font: inherit; background: #fbf7ee; border: 1px solid #8c7a5c; border-radius: 3px; padding: 2px 8px; cursor: pointer; }
    #info { margin-top: 8px; white-space: pre-line; min-height: 4em; }
    .hint { font-size: 11px; color: #6b5a44; margin-top: 6px; }
    #labels { position: fixed; inset: 0; pointer-events: none; }
    #labels span { position: absolute; transform: translate(-50%, -100%); font-size: 12px; color: #2e241a;
      background: rgba(251,247,238,.85); border: 1px solid #b9a888; padding: 0 5px; border-radius: 2px; white-space: nowrap; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="labels"></div>
  <div id="panel">
    <h1>地区格子地图</h1>
    <div>
      <button id="z0">近</button><button id="z1">中</button><button id="z2">远</button>
      <button id="follow">跟随</button><button id="regen">换一张</button>
    </div>
    <div><label>格数 <select id="size"><option>10</option><option selected>15</option></select></label></div>
    <div id="info">点格子查看；再点一次同一格即前往。</div>
    <div class="hint">拖拽平移 · 滚轮三档缩放 · +/- 缩放 · F 跟随</div>
  </div>
  <script type="module" src="../src/dev/region-demo.ts"></script>
</body>
</html>
